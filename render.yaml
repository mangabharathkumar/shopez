services:
  - type: web
    name: shopez-api
    runtime: node
    plan: free
    rootDir: Server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://shopez.vercel.app
      - key: ALLOW_VERCEL_ORIGINS
        value: true
      - key: ALLOW_MEMORY_STORE
        value: true
      - key: MONGO_TIMEOUT_MS
        value: 3000
      - key: JWT_SECRET
        generateValue: true

